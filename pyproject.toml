[project]
name = "dns-record-validator"
version = "0.1.0"
description = "Validate the syntax and field values of A, AAAA, MX, TXT, SRV, CNAME, and SOA resource records."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
